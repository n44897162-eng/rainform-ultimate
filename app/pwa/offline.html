<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rainform · 离线</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#0a1c30,#03070d 70%);
    color:#e9f5ff;font:14px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-align:center;padding:24px}
  .card{max-width:420px;padding:32px 28px;border:1px solid rgba(130,195,255,.16);border-radius:18px;background:rgba(9,20,34,.75)}
  .drop{width:44px;height:44px;margin:0 auto 18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:linear-gradient(135deg,#bfe9ff,#3b8fd6);box-shadow:0 0 30px rgba(110,190,255,.4)}
  h1{font-size:17px;margin:0 0 10px;font-weight:600}
  p{font-size:12px;color:#8aa7c0;margin:0 0 20px}
  button{border:1px solid rgba(143,214,255,.4);background:rgba(40,100,170,.4);color:#eaf8ff;
    border-radius:9px;padding:9px 20px;font-size:12px;cursor:pointer}
  button:hover{background:rgba(60,140,220,.6)}
</style>
</head>
<body>
<div class="card">
  <div class="drop"></div>
  <h1>当前处于离线状态</h1>
  <p>雨景本体已经缓存，恢复网络或重新打开即可继续；实时天气数据需要联网后自动重连。</p>
  <button onclick="location.href='./index.html'">重新进入 Rainform</button>
</div>
</body>
</html>
